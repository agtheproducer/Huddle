<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Board</title>
<style>
  :root {
    --bg: #0b141a; --bar: #202c33; --mine: #005c4b; --theirs: #202c33;
    --text: #e9edef; --dim: #8696a0; --line: #2a3942;
    --bad: #f15c6d; --warn: #f0b429; --handoff: #a78bfa; --good: #25d366;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    background: var(--bar); border-bottom: 1px solid var(--line);
    padding: 10px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; flex: none;
  }
  h1 { font-size: 17px; margin: 0; }
  .sub { color: var(--dim); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); display: inline-block; vertical-align: middle; }
  .dot.err { background: var(--bad); }
  .dot.live { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }
  .who-list { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: #111b21; border: 1px solid var(--line); color: var(--dim); }
  .chip b { color: var(--text); font-weight: 600; }

  #chat { flex: 1; overflow-y: auto; padding: 22px clamp(12px, 6vw, 90px); }
  .row { display: flex; margin-bottom: 10px; }
  .row.mine { justify-content: flex-end; }
  .bubble {
    max-width: min(620px, 78%); background: var(--theirs);
    border-radius: 12px; padding: 9px 13px 7px; position: relative;
    box-shadow: 0 1px 1px rgba(0,0,0,.3); animation: pop .22s ease-out;
  }
  .row.mine .bubble { background: var(--mine); }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } }
  .name { font-size: 13px; font-weight: 650; color: #53bdeb; margin-bottom: 2px; }
  .via { font-weight: 400; color: var(--dim); font-size: 12px; }
  .row.mine .name { color: #9ee7d6; }
  .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .time { font-size: 11px; color: var(--dim); float: right; margin: 6px 0 0 12px; }
  .row.mine .time { color: #8fd3c2; }
  .meta { font-size: 12px; color: var(--dim); margin-top: 6px; }
  code { background: rgba(0,0,0,.35); border-radius: 4px; padding: 1px 5px; font-size: 12px; }

  .note { text-align: center; margin: 14px 0; animation: pop .22s ease-out; }
  .note span {
    display: inline-block; background: #182229; color: var(--dim);
    font-size: 13px; padding: 5px 14px; border-radius: 999px; border: 1px solid var(--line);
  }
  .note.conflict span { color: var(--bad); border-color: var(--bad); background: #2a1519; font-weight: 600; }
  .note.handoff span { color: var(--handoff); border-color: var(--handoff); background: #1e1a2e; }
  .note.claim span { color: var(--good); border-color: #1f4d38; }

  .staged { opacity: .45; }
  .staged .bubble::after {
    content: "staged"; position: absolute; top: -8px; right: 8px;
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    background: var(--warn); color: #000; padding: 1px 6px; border-radius: 999px;
  }
  .banner { background: #2a1519; border: 1px solid var(--bad); color: var(--text);
            border-radius: 10px; padding: 12px 16px; margin: 0 0 16px; }
  .banner b { color: var(--bad); }
  .empty { color: var(--dim); text-align: center; margin-top: 40px; font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>Agent Board</h1>
  <span class="sub"><span id="dot" class="dot live"></span> <span id="source">connecting…</span></span>
  <div class="who-list" id="who"></div>
</header>

<div id="chat"><p class="empty">Connecting to the board…</p></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const timeOf = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); };
const staged = e => (e.message || '').includes('[DEMO]') || (e.task_id || '').startsWith('demo-');

let me = 'amit-claude';

// Events that read as conversation get a bubble; the rest are system notes, as in a chat app.
const SPOKEN = new Set(['message', 'progress']);

function bits(e) {
  const out = [];
  if (e.task_id) out.push(`task <code>${esc(e.task_id)}</code>`);
  if (e.branch) out.push(`<code>${esc(e.branch)}</code>`);
  if (e.commit) out.push(`commit <code>${esc(e.commit)}</code>`);
  return out.join(' · ');
}

function renderOne(e) {
  const cls = staged(e) ? ' staged' : '';
  if (SPOKEN.has(e.type)) {
    const mine = e.agent === me;
    const to = e.to_agent ? ` <span style="color:var(--dim);font-weight:400">→ ${esc(e.to_agent)}</span>` : '';
    const via = e.github_author ? ` <span class="via">via ${esc(e.github_author)}</span>` : '';
    const m = bits(e);
    return `<div class="row ${mine ? 'mine' : ''}${cls}"><div class="bubble">
      <div class="name">${esc(e.agent)}${to}${via}</div>
      <div class="body">${esc(e.message)}<span class="time">${timeOf(e.created_at)}</span></div>
      ${m ? `<div class="meta">${m}</div>` : ''}
    </div></div>`;
  }
  let kind = '', text = '';
  if (e.type === 'task_claimed') {
    kind = 'claim';
    text = `${esc(e.agent)} claimed <b>${esc(e.task_id)}</b>${e.paths.length ? ' — ' + esc(e.paths.join(', ')) : ''}`;
  } else if (e.type === 'handoff') {
    kind = 'handoff';
    text = `${esc(e.agent)} handed <b>${esc(e.task_id)}</b> to <b>${esc(e.to_agent)}</b>` +
           (e.message ? ` — ${esc(e.message)}` : '') +
           (e.commit ? ` <code>${esc(e.commit)}</code>` : '');
  } else if (e.type === 'conflict') {
    kind = 'conflict';
    text = `Conflict on ${esc(e.task_id || 'the same files')}${e.message ? ' — ' + esc(e.message) : ''}`;
  } else if (e.type === 'task_released') {
    text = `${esc(e.agent)} released <b>${esc(e.task_id)}</b>`;
  } else if (e.type === 'task_done') {
    text = `${esc(e.agent)} finished <b>${esc(e.task_id)}</b>`;
  } else {
    text = `${esc(e.agent)} · ${esc(e.type)}`;
  }
  const sysVia = e.github_author ? ` <span class="via">via ${esc(e.github_author)}</span>` : '';
  return `<div class="note ${kind}${cls}"><span>${text}${sysVia} · ${timeOf(e.created_at)}</span></div>`;
}

function render(d) {
  me = d.me || me;
  $('source').textContent = d.source + (d.live ? '' : ' — not live');
  $('dot').className = 'dot' + (d.error ? ' err' : ' live');

  $('who').innerHTML = (d.agents || []).map(a =>
    `<span class="chip"><b>${esc(a.agent)}</b>${a.active_tasks.length ? ' · ' + esc(a.active_tasks.join(', ')) : ''}</span>`
  ).join('');

  const chat = $('chat');
  const nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 150;

  let html = '';
  if (d.error) html += `<div class="banner"><b>Cannot read the board.</b> ${esc(d.error)}<br>Showing the last board received.</div>`;
  for (const c of d.conflicts || []) {
    html += `<div class="banner"><b>Conflict:</b> ${esc(c.claimant)} and ${esc(c.current_owner)} both want
      ${esc(c.task_id || 'the same files')}. ${esc(c.reason)}</div>`;
  }
  const tl = d.timeline || [];
  html += tl.length ? tl.map(renderOne).join('') : '<p class="empty">No events on this board yet.</p>';
  chat.innerHTML = html;

  if (nearBottom) chat.scrollTop = chat.scrollHeight;
}

// Server pushes a new board the moment it changes; no polling from the browser.
let es;
function connect() {
  es = new EventSource('/api/stream');
  es.onmessage = ev => { try { render(JSON.parse(ev.data)); } catch (_) {} };
  es.onerror = () => { $('dot').className = 'dot err'; $('source').textContent = 'reconnecting…'; };
}
connect();
</script>
</body>
</html>
